
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Date Recovery Tool</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-page">

    <div class="login-card">


        <!-- =====================================================
             LOGO
        ====================================================== -->

        <div class="login-logo">

            <div class="logo-box">
            </div>

            <div class="logo-text">

                <h1>FINANCE</h1>

                <span>
                    DATE RECOVERY TOOL
                </span>

            </div>

        </div>


        <!-- =====================================================
             LOGIN TITLE
        ====================================================== -->

        <h2>Staff Login</h2>

        <p class="login-description">
            Secure login to your account
        </p>


        <!-- =====================================================
             LOGIN FORM
        ====================================================== -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- ERROR MESSAGE -->

            <div
                id="errorMessage"
                class="error-message">
            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
                class="login-button">

                Login

            </button>


        </form>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <p class="login-footer">

            Finance Date Recovery Tool

        </p>


    </div>

</div>


<!-- =========================================================
     LOGIN JAVASCRIPT
========================================================== -->

<script src="index.js"></script>


</body>

</html>
