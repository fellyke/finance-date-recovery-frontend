<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Date Recovery Tool</title>
    
<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-page">

    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            <div class="logo-box">
                
            </div>

            <div class="logo-text">

                <h1>FINANCE</h1>

                <span>
                    DATE RECOVERY TOOL
                </span>

            </div>

        </div>


        <h2>Staff Login</h2>

        <p class="login-description">
            Secure login to your account
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div
                id="errorMessage"
                class="error-message">
            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>


        </form>


        <p class="login-footer">

            Finance Date Recovery Tool

        </p>


    </div>

</div>



<script src="script.js"></script>

<script src="index.js"></script>
</body>

</html>
